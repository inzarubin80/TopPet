## NOTE:
## This file is copied to /etc/nginx/conf.d/default.conf (see client/Dockerfile),
## which is included from nginx.conf inside the `http {}` context.
## Therefore directives like `upstream` must be declared at top-level (http-context),
## NOT inside `server {}`.
##
## ПРИ ПРАВКАХ НЕ ЛОМАТЬ:
## 1. Превью ссылок в соцсетях: map $contest_backend + location ~ ^/contests/... + @contest_fallback
##    (боты по User-Agent проксируются на API для og/twitter; иначе — SPA).
## 2. Просмотр видео: в CSP обязательно media-src 'self' https: (видео с S3/CDN).
## 3. Метрика: см. https://yandex.com/support/metrica/en/code/install-counter-csp.html — connect-src/wss: mc.yandex.ru,
##    mc.yandex.com, mc.webvisor.org, mc.webvisor.com (без mc.webvisor.com watch.js/Webvisor часто (blocked:csp)).

## Превью в соцсетях: для ботов (User-Agent) проксируем /contests/* на API, для остальных — SPA
## Если превью по shotcontest.ru не показывается — смотреть access_log (backend:"" = не попал в список)
map $http_user_agent $contest_backend {
    # Без User-Agent / типичные fetch — иначе отдаётся SPA без og (часть клиентов так ходит)
    "" "https://api.shotcontest.ru";
    "~*^curl/" "https://api.shotcontest.ru";
    "~*Go-http-client" "https://api.shotcontest.ru";
    "~*python-requests" "https://api.shotcontest.ru";
    "~*axios/" "https://api.shotcontest.ru";
    "~*telegrambot" "https://api.shotcontest.ru";
    "~*telegram" "https://api.shotcontest.ru";
    "~*whatsapp" "https://api.shotcontest.ru";
    "~*facebookexternalhit" "https://api.shotcontest.ru";
    "~*facebot" "https://api.shotcontest.ru";
    "~*vkshare" "https://api.shotcontest.ru";
    "~*vk" "https://api.shotcontest.ru";
    "~*twitterbot" "https://api.shotcontest.ru";
    "~*linkedinbot" "https://api.shotcontest.ru";
    "~*discordbot" "https://api.shotcontest.ru";
    "~*slurp" "https://api.shotcontest.ru";
    "~*Teams" "https://api.shotcontest.ru";
    "~*TeamsMobile" "https://api.shotcontest.ru";
    "~*SkypeUriPreview" "https://api.shotcontest.ru";
    "~*Slackbot" "https://api.shotcontest.ru";
    "~*Slack-" "https://api.shotcontest.ru";
    "~*Googlebot" "https://api.shotcontest.ru";
    "~*Google-InspectionTool" "https://api.shotcontest.ru";
    "~*Applebot" "https://api.shotcontest.ru";
    "~*Bingbot" "https://api.shotcontest.ru";
    "~*YandexBot" "https://api.shotcontest.ru";
    "~*YandexMobileBot" "https://api.shotcontest.ru";
    "~*YandexImages" "https://api.shotcontest.ru";
    "~*YandexVideoParser" "https://api.shotcontest.ru";
    "~*YandexAccessibilityBot" "https://api.shotcontest.ru";
    "~*Pinterest" "https://api.shotcontest.ru";
    "~*Embedly" "https://api.shotcontest.ru";
    "~*Meta-URI" "https://api.shotcontest.ru";
    "~*linkpreview" "https://api.shotcontest.ru";
    "~*urlpreview" "https://api.shotcontest.ru";
    "~*Preview" "https://api.shotcontest.ru";
    "~*sindresorhus/got" "https://api.shotcontest.ru";
    default "";
}

# Лог запросов с User-Agent и признаком прокси на API (для отладки превью ботов)
# В контейнере: docker logs <client_container> или смотреть /var/log/nginx/access_agents.log на хосте при volume
log_format agents '$remote_addr - "$http_user_agent" - "$http_referer" - "$request" - $status - backend:"$contest_backend"';

server {
    listen 3000;  # Слушаем порт 3000
    server_name localhost;

    # Нужен для proxy_pass с переменной (api.shotcontest.ru): nginx резолвит имя в момент запроса
    # В Docker — встроенный DNS; вне Docker можно указать 8.8.8.8 или 1.1.1.1
    resolver 127.0.0.11 valid=10s ipv6=off;

    access_log /dev/stdout agents;

    # CSP (см. чеклист выше): media-src 'self' https: — для просмотра видео; connect-src/frame-src — для Метрики; wss://mc.yandex.ru wss://mc.webvisor.org — WebSocket Метрики (solid.ws), иначе CSP блокирует.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval' https://mc.yandex.ru https://mc.yandex.com https://yastatic.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://api.shotcontest.ru https://mc.yandex.ru https://mc.yandex.com https://mc.webvisor.org https://mc.webvisor.com wss://api.shotcontest.ru wss://mc.yandex.ru wss://mc.yandex.com wss://mc.webvisor.org wss://mc.webvisor.com; img-src 'self' data: https: https://mc.yandex.ru https://mc.yandex.com; media-src 'self' https:; frame-src 'self' blob: https://mc.yandex.ru https://mc.yandex.com https://mc.webvisor.org https://mc.webvisor.com; object-src 'none'; base-uri 'self';";

    # Увеличиваем буферы для длинных заголовков и URL (для OAuth токенов в query параметрах)
    large_client_header_buffers 4 32k;
    client_header_buffer_size 32k;

    root /usr/share/nginx/html;
    index index.html;

    # robots.txt и sitemap.xml — только статика из build (public/).
    # Локальный error_page переопределяет глобальный 404→index.html, иначе при отсутствии файла отдавался бы SPA.
    location = /robots.txt {
        error_page 404 = @seo_static_missing;
        try_files /robots.txt =404;
        default_type text/plain;
        charset utf-8;
    }

    location = /sitemap.xml {
        error_page 404 = @seo_static_missing;
        try_files /sitemap.xml =404;
        default_type application/xml;
        charset utf-8;
    }

    location @seo_static_missing {
        internal;
        return 404;
    }

    # Страницы конкурса/участника (превью ссылок в соцсетях): боты — на API (og/twitter), остальные — SPA
    # Учитываем завершающий / (Telegram/UTM и др. иначе отдают SPA без og — см. try_files → index.html)
    location ~ ^/contests/[^/]+(/participants/[^/]+)?/?$ {
        try_files $uri $uri/ @contest_fallback;
    }
    location @contest_fallback {
        if ($contest_backend = "") {
            rewrite ^ /index.html last;
        }
        proxy_pass $contest_backend$request_uri;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host api.shotcontest.ru;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Главная страница: боты — на API (HTML с og/twitter для роботов), остальные — SPA
    location = / {
        if ($contest_backend = "") {
            rewrite ^ /index.html last;
        }
        proxy_pass $contest_backend/;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host api.shotcontest.ru;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # SPA routing - все запросы направляем на index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Error pages
    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
